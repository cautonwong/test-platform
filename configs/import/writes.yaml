# 条款里有、上游字典里 0 命中的:只有这一个。反向断言在 writable_params.yaml 的 name_needle
# (在 5 份上游字典里必须 0 命中,上游哪天补了会红)。
no_field_found:
  通信模式: >-
    全仓只有 pypack/pyproto/README.md:33 一句注释(指链路层 ConnectionModes.HDLC),
    那不是表内可写点。没有 DI ⇒ 没有长度、没有类型、没有图例换算可言。
    要手册:这个参数在表里到底叫什么、DI 或寄存器地址是什么。
