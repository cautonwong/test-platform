# 写入格式:DL/T645 数据的 DI / 长度 / 类型 / 图例换算,全部从上游 p645dict.py 反查。
#
# 票 43 把「写入格式」列进了「要资料清单」。票 44 的结论:它一直在上游 —— p645dict.py 每条记录
# 是一个 12 元组,第 0 位是数据标识(DI)、第 1 位是 c、第 2 位是长度、第 3 位是数据类型;
# 文件头 1-20 行是类型图例(Date = YYMMDDWW、Time = hhmmss、String = 定长字符串)。所以
# 「时钟写 YYMMDDWW 4 字节」「通信地址写 6 字节字符串」不用手册,这里就是它们的机器可读形态。
#
# 校验:python tools/check_import_sources.py --upstream <上游目录>
# 脚本用这条记录自己的 di/c/length/type 拼出 "'名字':('DI', c, length, 'type'" 去上游那一行比对。
# 抄错一位、行号差一行、名字差一个字都会红 —— 提取类工作最典型的错法,人眼抽查挡不住。
#
# 图例换算(legend.digits = 2 * 字段的 length)是**推论**,不是上游写明的字:
# 8 个字母布局配 4 字节,只能是每字节两位十进制(BCD)。线上顺序是 DL/T645 的低字节先发,
# 与 src/testplatform/protocol/dlt645.py 里地址域/数据标识的规则同一条。
# 字节对得上的实证在 tests_unit/test_p645_write_format.py(不连设备)。
#
# '96' / '03' 是 tuple 第 9 位(0 基)。上游第 23 行的字段注释在这里对不上 12 元组
# (注释把 'w', '', '03', rw=…, rule='03,04,96,97' 挤在一段),所以只记原值:
# **疑似权限等级,含义未证实**。不许当通信密码、不许当密级去实现。
#
# 不许把这些 DI 当 Modbus 寄存器地址:DL/T645 DI ≠ DLMS OBIS ≠ Modbus 寄存器,三套编号体系。
# 也不许因为 DI 有出处就撤掉 mode: real 守卫 —— DI 有出处 ≠ 台架/设备地址已就位。

# 类型图例:source 指到 p645dict.py 那一行,layout 必须出现在那一行上。
# digits = 这个类型占几位十进制数字(用于与 tuple 的 length 交叉核对:2 位 = 1 字节)。
legend:
  Date:
    layout: YYMMDDWW
    fields_zh: 年 月 日 星期
    digits: 8
    source: "common/p645dict.py:5"
  Time:
    layout: hhmmss
    fields_zh: 时 分 秒
    digits: 6
    source: "common/p645dict.py:6"
  DateWeekTime:
    layout: YYMMDDWWhhmmss
    fields_zh: 年 月 日 星期 时 分 秒
    digits: 14
    source: "common/p645dict.py:8"
  String:
    layout: null
    fields_zh: 定长字符串(上游只给长度,没给每字节怎么编)
    digits: null
    source: "common/p645dict.py:18"
  Integer:
    layout: null
    fields_zh: 数值(图例只写"数值",字节布局没给)
    digits: null
    source: "common/p645dict.py:17"

# 每条一个 DI。used_by 是「哪个条款参数落到它身上」,不新增语义,只做反查索引。
