# 操作类型词表 → 8 个原子动作。
#
# 上游实测 67 种取值(全表扫完;`None` 是"单元格空着",不是取值,归结构异常 no_op_type)。
# 变体是机械的,但**不猜**:这张表里没有的取值不会默认归到 none,而是进覆盖率报表的
# "映射缺口",等人补表。none 只放明确写了"/"(无操作)的格子。
#
# 校验(tools/import_cases.py::_validate_ops):
#   - 动作名只能取下面这 8 个,少一个、多一个都在导入时报错
#   - 同一个操作类型写在两处是配置错误(静默取后者会让报表对不上)
#
# 需要平台真正执行的动作只有三个:write(写 → 读回 → 判相等,落 setting_cases)、
# read(读数键)、bench(台架量)。manual 是"人做的,平台只留占位";wait / exec / loop
# 与 none 目前只用来分类与统计,不进 setting_cases —— 它们要么没有因果链,要么表达不了。

write:          # 写参数:写完读回判相等
  - 写
  - 写/判断
  - 写判断
  - 读写判断
  - 设置/判断
  - 写/执行            # 发送一条写命令(如 reset结算数据)
  - 写/硬件操作        # 上游这么标,动作却是"移除 S1""退工厂"这类人工动作之外的一次写
  - 时钟               # "修改时钟"的单字标签

read:           # 读数:按读数键取数
  - 读
  - 读/判断
  - 读取/判断
  - 读/记录
  - 读/保存
  - 读/存储
  - 定时读/判断
  - 定时读

bench:          # 调台架:电压 / 电流 / 相角 / 源,不判被测设备
  - 调整台体
  - 调整台体1
  - 调整台体2
  - 台体
  - 台体操作
  - 操作台体
  - 调整稳压源
  - 定时调整台体
  - 定时操作台体
  - 去掉电压电流
  - 保留电压去电流

wait:
  - 延时
  - 延迟
  - 延迟等待
  - 延时等待
  - /延时
  - 定时               # "定时"+ 时间参数:等到那个时刻;定时执行是 exec,分开

manual:         # 人工操作:平台只执行前面的自动步骤,到这里 skip 并留占位
  - 人工操作
  - 人工操作/判断
  - 人工/判断
  - 人工判断
  - 手动
  - 手动操作
  - 手工
  - 手工操作
  - 观察/判断          # 目视看液晶,表不会回答
  - 按键/判断          # 按键翻页
  - 判断               # 只有一个判断动作 + 液晶现象
  - 硬件操作           # 插拔电池
  - 操作               # 硬件短接 Dataflash
  - 拔掉电池
  - 装上电池
  - 掉电
  # 单元格里写成描述而不是词表值:仍然是人工动作,照实归 manual
  - 人工操作（加电流走字，读取便携源台体测量的电表走字误差精度）
  - 人工操作以         # 被截断的一句话(原文比单元格长)

exec:           # 平台下发一条不缺参数的命令:没有写-读回语义
  - 执行
  - 执行/判断
  - 定时执行
  - 定时操作
  - 初始化定时器
  - 动作/判断
  - 文件校验

none:           # 明确的"这一步什么都不做"
  - "/"

loop:           # 循环 / 重复:setting_cases 表达不了,归场景层或人工
  - 循环
  - 循环操作
  - 循环条件
  - 循环执行
  - 重复
  - 重复执行
  - 重复步骤
