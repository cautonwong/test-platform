# 由 tools/gen_scale_manifest.py 生成,不要手改:改规模就改脚本再重跑。
# P0 规模验收清单:200 台被测设备(4 型号 × 50)+ 3 台终端 × 每台 20 块表 + 2 台周边设备。
# 不进默认 testpaths、不是默认 --device-config,默认套件不受影响。
# 跑法: python -m pytest -q --device-config configs/devices_scale.yaml
criteria_profiles:
  grid_50hz:
  - quantity: grid_freq_hz
    min: 45
    max: 55
  - quantity: grid_voltage_v
    gt: 0
  - quantity: output_power_w
    min: 0
    max:
      rated_power_w: 1.1
  - quantity: output_power_w
    max:
      rated_power_w: 0.9
    severity: warn
  battery_default:
  - quantity: voltage_v
    gt: 0
  - quantity: soc_percent
    min: 10
    severity: warn
  meter_220v:
  - quantity: 电压
    min: 198
    max: 242
  - quantity: 有功电量
    min: 0
models:
  inverter_pv_series:
    type: inverter
    protocol: vendor_ascii
    criteria: grid_50hz
    capabilities:
    - 有功功率
    - 电压
    - 频率
    device_params:
    - rated_power_w
    point_table:
      有功功率:
        address: 0
        length: 8
        encoding: ascii
        unit: W
      电压:
        address: 1
        length: 7
        encoding: ascii
        unit: V
      频率:
        address: 2
        length: 7
        encoding: ascii
        unit: Hz
  battery_lfp_series:
    type: battery
    protocol: vendor_ascii
    criteria: battery_default
    capabilities:
    - SOC
    - 电压
    - 电流
    device_params:
    - capacity_ah
    point_table:
      SOC:
        address: 0
        length: 6
        encoding: ascii
        unit: '%'
      电压:
        address: 1
        length: 7
        encoding: ascii
        unit: V
      电流:
        address: 2
        length: 7
        encoding: ascii
        unit: A
  grid_simulator_3ph:
    type: grid_simulator
    protocol: vendor_ascii
    capabilities:
    - Ua
    - Ub
    - Uc
    - Ia
    - Ib
    - Ic
    - θa
    - θb
    - θc
    - QUaUb
    - QUaUc
    - Fre
    - 接线方式
    - MeterConst
    point_table:
      Ua:
        address: TODO
        length: 7
        encoding: ascii
        unit: V
        writable: true
      Ub:
        address: TODO
        length: 7
        encoding: ascii
        unit: V
        writable: true
      Uc:
        address: TODO
        length: 7
        encoding: ascii
        unit: V
        writable: true
      Ia:
        address: TODO
        length: 7
        encoding: ascii
        unit: A
        writable: true
      Ib:
        address: TODO
        length: 7
        encoding: ascii
        unit: A
        writable: true
      Ic:
        address: TODO
        length: 7
        encoding: ascii
        unit: A
        writable: true
      θa:
        address: TODO
        length: 7
        encoding: ascii
        unit: °
        writable: true
      θb:
        address: TODO
        length: 7
        encoding: ascii
        unit: °
        writable: true
      θc:
        address: TODO
        length: 7
        encoding: ascii
        unit: °
        writable: true
      QUaUb:
        address: TODO
        length: 7
        encoding: ascii
        unit: °
        writable: true
      QUaUc:
        address: TODO
        length: 7
        encoding: ascii
        unit: °
        writable: true
      Fre:
        address: TODO
        length: 7
        encoding: ascii
        unit: Hz
        writable: true
      接线方式:
        address: TODO
        length: 2
        encoding: uint
        writable: true
      MeterConst:
        address: TODO
        length: 2
        encoding: uint
        writable: true
  dtsd1352_modbus:
    type: meter
    protocol: modbus_rtu
    criteria: meter_220v
    capabilities:
    - 有功电量
    - 电压
    point_table:
      有功电量:
        address: 0
        length: 4
        encoding: uint
        scale: 0.01
        unit: kWh
      电压:
        address: 2
        length: 2
        encoding: uint
        scale: 0.1
        unit: V
      有功计量模式:
        address: 3
        length: 2
        encoding: uint
        writable: true
  dlt645_meter:
    type: meter
    protocol: dlt645
    criteria: meter_220v
    capabilities:
    - 有功电量
    - 电压
    point_table:
      有功电量:
        address: '00010000'
        length: 4
        encoding: bcd
        scale: 0.01
        byteorder: little
        unit: kWh
      电压:
        address: '02010100'
        length: 2
        encoding: bcd
        scale: 0.1
        byteorder: little
        unit: V
  dlt645_terminal:
    type: terminal
    protocol: dlt645
    capabilities:
    - 上电运行时间
    point_table:
      上电运行时间:
        address: 02800085
        length: 4
        encoding: int
        scale: 1
        byteorder: little
        unit: s
