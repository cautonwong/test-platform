# 标准条款受控清单(票 07)。
#
# 用例按 **id** 引用条款:`@case(id="M_00_00_01_000002_09", clause="DLT645-4.5.2")`。
# 收集期校验:不在本清单里的 id → 报错并列出可用 id;确实不是受控条款时写
# `clause="free: <原文>"`(迁移期旧写法,报告里按自由文本单独聚合)。
#
# **summary 是本仓库这组用例的用法概括,不是标准原文标题。** 条款原文没有入库,
# 编一个像原文的标题会让"我们写的概括"变成"标准的要求"。报告只能用它说明
# "这组用例测什么",不得渲染成"依据 DL/T 645 4.5.2「……」"这种像原文的样子。
#
# 标准 / 编号沿用仓库里原有的字符串(上游 legacy 平台的用例编号带这组标签),不是本次新声明的映射。
#
# 加一条条款 = 在这里加一行;改 id 会打断已发出的历史证据里的引用,别改。

clauses:
  # ---- DL/T 645(多功能电能表通信协议)----
  DLT645-4.5.1: {standard: "DL/T 645", number: "4.5.1", summary: "连接与建立通信"}
  DLT645-4.5.2: {standard: "DL/T 645", number: "4.5.2", summary: "读数与参数设置回读"}
  # 已知豁免(not_applicable):本平台验不了,理由写在行内。缺点数不再算缺口,但豁免本身留在目录里。
  # 为什么不是写一条用例:本仓库没有这条条款的原文(上游导入只给用例编号,没有条款正文),
  # 而现有 DL/T645 型号的点表只声明了电量 / 电压 / 时钟 —— 不知道条款要什么,写出来的用例
  # 只能是"读完就 pass",那比缺覆盖更糟。TODO(来源):拿到条款原文后重新判断。
  DLT645-4.5.3:
    standard: "DL/T 645"
    number: "4.5.3"
    summary: "当前只用作用例身份示例,没有专门用例"
    not_applicable: "本仓库没有该条款原文,DL/T645 型号的点表也没有可对应到它的量:TODO(来源)拿到条款原文后重判"
  DLT645-4.5.4: {standard: "DL/T 645", number: "4.5.4", summary: "读数历史与窗口"}
  DLT645-4.5.5: {standard: "DL/T 645", number: "4.5.5", summary: "未知读数键的错误提示"}
  DLT614-设置类条款: {standard: "DL/T 614", number: "", summary: "设置类条款的台架复位与收尾"}

  # ---- GB/T 17215.321(静止式有功电能表)----
  GBT17215.321-走字误差: {standard: "GB/T 17215.321", number: "", summary: "走字误差的派生判据(场景层)"}

  # ---- GB/T 34131(电化学储能电站用锂离子电池管理系统)----
  GBT34131-5.1.1: {standard: "GB/T 34131", number: "5.1.1", summary: "电池连接"}
  GBT34131-5.2.1: {standard: "GB/T 34131", number: "5.2.1", summary: "电池 SOC 判据与能力声明"}
  GBT34131-5.2.2: {standard: "GB/T 34131", number: "5.2.2", summary: "点表驱动的通用读数"}
  GBT34131-5.2.3: {standard: "GB/T 34131", number: "5.2.3", summary: "读数键到领域量"}
  GBT34131-5.2.4: {standard: "GB/T 34131", number: "5.2.4", summary: "低 SOC 软告警"}

  # ---- GB/T 37408(光伏发电并网逆变器)----
  GBT37408-5.1.1: {standard: "GB/T 37408", number: "5.1.1", summary: "逆变器连接"}
  GBT37408-5.1.2: {standard: "GB/T 37408", number: "5.1.2", summary: "经工控机网关接入"}
  GBT37408-5.2.1: {standard: "GB/T 37408", number: "5.2.1", summary: "按读数键读数、场景设定点(引用最广的一组)"}
  GBT37408-5.2.2: {standard: "GB/T 37408", number: "5.2.2", summary: "点表驱动的通用读数与归因用例"}
  GBT37408-5.2.3: {standard: "GB/T 37408", number: "5.2.3", summary: "读数键到领域量与归因用例"}
  GBT37408-5.2.4: {standard: "GB/T 37408", number: "5.2.4", summary: "读数历史与归因用例"}
  # 同上:编号只出现在"归因用例被跳过/筛掉"的夹具里,没有一条用例真的验这条条款。
  # TODO(来源):GB/T 37408 5.2.5 的原文(上游条款表里没有这一条)。
  GBT37408-5.2.5:
    standard: "GB/T 37408"
    number: "5.2.5"
    summary: "归因用例(仅被跳过 / 筛掉的那几条)"
    not_applicable: "没有条款原文,也没有对应到它的设备能力/点表量,无法构造可判定的用例:TODO(来源)"
  GBT37408-5.3.1: {standard: "GB/T 37408", number: "5.3.1", summary: "协议超时内的应答"}
